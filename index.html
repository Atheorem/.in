document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\n/* latin */\n@font-face {\n  font-family: 'Syncopate';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"adb0e1f2-7fc6-481b-90cc-cda5bab8139b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root {\n    --bg: #06070b;\n    --bg-2: #0b0d14;\n    --bg-3: #0e1119;\n    --ink: #f3f4f8;\n    --ink-dim: #8a8fa3;\n    --accent: #ff4d2e;\n    --accent-2: #00e5ff;\n    --accent-3: #b266ff;\n    --accent-4: #ffae00;\n    --line: rgba(255,255,255,0.08);\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  html { background: var(--bg); color: var(--ink); font-family: 'Space Grotesk', system-ui, sans-serif; scroll-behavior: smooth; overflow-x: clip; }\n  body { background: var(--bg); color: var(--ink); font-family: 'Space Grotesk', system-ui, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: clip; }\n  a { color: inherit; text-decoration: none; }\n  img { max-width: 100%; display: block; }\n\n  /* Loader */\n  #loader {\n    position: fixed; inset: 0; background: var(--bg); z-index: 9999;\n    display: flex; align-items: center; justify-content: center;\n    transition: opacity 0.8s ease, visibility 0.8s ease;\n  }\n  #loader.hidden { opacity: 0; visibility: hidden; }\n  .loader-inner { text-align: center; }\n  .loader-text {\n    font-family: 'Syncopate', sans-serif; font-size: 13px; letter-spacing: 0.6em;\n    color: var(--ink-dim); text-transform: uppercase;\n  }\n  .loader-bar {\n    width: 240px; height: 1px; background: rgba(255,255,255,0.1); margin: 20px auto 0;\n    position: relative; overflow: hidden;\n  }\n  .loader-bar::before {\n    content: ''; position: absolute; left: 0; top: 0; height: 100%;\n    width: 30%; background: linear-gradient(90deg, transparent, var(--accent), transparent);\n    animation: loaderSlide 1.4s ease-in-out infinite;\n  }\n  @keyframes loaderSlide { 0% { left: -30%; } 100% { left: 100%; } }\n\n  /* Custom red-dot cursor (hide native everywhere) */\n  * { cursor: none !important; }\n  .cursor {\n    position: fixed; width: 10px; height: 10px; border-radius: 50%;\n    background: var(--accent); pointer-events: none; z-index: 10000;\n    top: 0; left: 0; transform: translate(-50%, -50%);\n    transition: width 0.18s, height 0.18s, background 0.18s, opacity 0.2s;\n    box-shadow: 0 0 12px rgba(255,77,46,0.95), 0 0 24px rgba(255,77,46,0.45);\n  }\n  .cursor.hover { width: 36px; height: 36px; background: transparent;\n    border: 1px solid var(--accent); box-shadow: 0 0 0 1px rgba(255,77,46,0.15); }\n  .cursor.click { width: 6px; height: 6px; background: var(--accent-2); }\n  @media (hover: none) { .cursor { display: none; } * { cursor: auto !important; } }\n\n  /* Nav */\n  nav.top {\n    position: fixed; top: 0; left: 0; right: 0; z-index: 100;\n    padding: 18px 30px; display: flex; align-items: center; justify-content: space-between;\n    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);\n    background: linear-gradient(180deg, rgba(6,7,11,0.85), rgba(6,7,11,0.3));\n    border-bottom: 1px solid transparent;\n    transition: padding 0.3s, background 0.3s, border-color 0.3s;\n  }\n  nav.top.scrolled { padding: 14px 30px; background: rgba(6,7,11,0.92); border-bottom-color: var(--line); }\n  .logo {\n    font-family: 'Syncopate', sans-serif; font-size: 13px; font-weight: 700;\n    letter-spacing: 0.2em; display: flex; align-items: center; gap: 12px;\n  }\n  /* Logo blending */\n  .logo {\n    display: inline-flex; align-items: center; gap: 12px;\n    font-family: 'Syncopate', sans-serif; font-weight: 700;\n    font-size: 16px; letter-spacing: 0.18em; text-transform: uppercase;\n    color: #fff;\n  }\n  .logo span {\n    background: linear-gradient(180deg, #fff 0%, #fff 60%, #d8d8d8 100%);\n    -webkit-background-clip: text; background-clip: text;\n    -webkit-text-fill-color: transparent;\n  }\n  .logo-mark {\n    width: 36px; height: 36px; object-fit: contain; display: block;\n    filter: drop-shadow(0 0 10px rgba(255,77,46,0.45)) drop-shadow(0 0 2px rgba(255,77,46,0.6));\n    border-radius: 6px;\n  }\n  nav.top ul { display: flex; gap: 22px; list-style: none; }\n  nav.top a {\n    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;\n    color: var(--ink-dim); transition: color 0.2s; position: relative;\n  }\n  nav.top a:hover { color: var(--ink); }\n  nav.top a::after {\n    content: ''; position: absolute; left: 0; bottom: -6px; width: 0; height: 1px;\n    background: var(--accent); transition: width 0.3s;\n  }\n  nav.top a:hover::after { width: 100%; }\n  .nav-cta {\n    padding: 9px 18px; border: 1px solid var(--line); border-radius: 100px;\n    font-size: 11px !important; letter-spacing: 0.15em; text-transform: uppercase;\n    transition: all 0.3s; background: rgba(255,255,255,0.02);\n  }\n  .nav-cta:hover { border-color: var(--accent); color: var(--accent) !important; }\n  .menu-toggle { display: none; background: none; border: none; color: var(--ink); cursor: pointer; font-size: 22px; }\n  @media (max-width: 1100px) {\n    nav.top { padding: 16px 20px; }\n    nav.top ul { display: none; }\n    .menu-toggle { display: block; }\n    nav.top.menu-open ul {\n      display: flex; flex-direction: column; position: absolute;\n      top: 100%; left: 0; right: 0; background: rgba(6,7,11,0.98);\n      padding: 30px; gap: 20px; border-bottom: 1px solid var(--line);\n    }\n  }\n\n  /* Hero */\n  .hero {\n    position: relative; height: 100vh; min-height: 640px;\n    display: flex; align-items: center; justify-content: flex-start;\n    overflow: hidden;\n  }\n  #hero-canvas { position: absolute; inset: 0; z-index: 1; }\n  .hero-content {\n    position: relative; z-index: 3; text-align: left;\n    padding: 0 60px; pointer-events: none; max-width: 56%;\n  }\n  @media (max-width: 900p orm: rotateY(180deg) translateZ(42px); }\n  .sec-fx .fx-cube i:nth-child(4){ transform: rotateY(270deg) translateZ(42px); border-color: rgba(0,229,255,0.32); }\n  .sec-fx .fx-cube i:nth-child(5){ transform: rotateX(90deg)  translateZ(42px); }\n  .sec-fx .fx-cube i:nth-child(6){ transform: rotateX(-90deg) translateZ(42px); }\n  .sec-fx .fx-orbit {\n    position: absolute; inset: 4px; border-radius: 50%;\n    border: 1px dashed rgba(0,229,255,0.22);\n    transform: rotateX(72deg); animation: secOrbit 12s linear infinite;\n  }\n  .sec-fx .fx-orbit::after {\n    content: ''; position: absolute; top: -4px; left: 50%; width: 7px; height: 7px;\n    margin-left: -3.5px; border-radius: 50%; background: var(--accent);\n    box-shadow: 0 0 12px 2px rgba(255,77,46,0.7);\n  }\n  @keyframes secSpin { to { transform: rotateX(360deg) rotateY(360deg); } }\n  @keyframes secOrbit { from { transform: rotateX(72deg) rotateZ(0); } to { transform: rotateX(72deg) rotateZ(360deg); } }\n  @media (max-width: 820px) { .sec-fx { width: 96px; height: 96px; opacity: 0.7; } .sec-fx .fx-cube { inset: 22px; } .sec-fx .fx-cube i { width: 52px; height: 52px; } .sec-fx .fx-cube i:nth-child(n){ } .section-header.center .sec-fx { top: -60px; } }\n  @media (max-width: 560px) { .sec-fx { display: none; } }\n\n  /* ── Industry card: animated 3D scene ── */\n  .industry { perspective: 900px; }\n  .ind-floor {\n    position: absolute; left: -30%; right: -30%; bottom: -6%; height: 62%;\n    background-image:\n      linear-gradient(rgba(255,255,255,0.14) 1px, transparent 1px),\n      linear-gradient(90deg, rgba(255,255,255,0.14) 1px, transparent 1px);\n    background-size: 26px 26px;\n    transform: rotateX(72deg); transform-origin: bottom center;\n    -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 85%);\n    mask-image: linear-gradient(to top, #000 10%, transparent 85%);\n    animation: indFloor 7s linear infinite; opacity: 0.55; pointer-events: none;\n  }\n  @keyframes indFloor { from { bac eld as a background on portrait/mobile too, so the\n       16:9 hero visual is present in 9:16. Sits behind the centered content. */\n    .hero-canvas-wrap { display: block; position: absolute; inset: 0; z-index: 1; opacity: 0.55; }\n    .hero { position: relative; }\n    .hero-content { position: relative; z-index: 3; padding: 0 20px; max-width: 100%; text-align: center; }\n    .hero-eyebrow { font-size: 10px; letter-spacing: 0.4em; margin-bottom: 16px; }\n    .hero-title { font-size: clamp(34px, 9vw, 64px); }\n    .hero-sub { font-size: 14px; margin-top: 18px; }\n    .hero-actions { margin-top: 24px; gap: 10px; }\n    .btn-primary, .btn-ghost { padding: 12px 22px; font-size: 11px; letter-spacing: 0.18em; }\n    nav.top { padding: 14px 18px; }\n    .logo span { font-size: 14px; letter-spacing: 0.15em; }\n    .logo-mark { width: 30px; height: 30px; }\n  }\n  @media (max-width: 600px) {\n    .hero-title { font-size: clamp(32px, 10vw, 56px); line-height: 0.95; }\n    .hero-eyebrow { font-size: 9px; }\n    section { padding: 44px 16px; }\n    .section-header { margin-bottom: 28px; }\n    .section-title { font-size: clamp(28px, 8vw, 44px) !important; }\n    .section-desc { font-size: 14px !important; }\n    .featured { padding: 0 !important; gap: 28px !important; }\n    .featured-info h3 { font-size: clamp(28px, 8vw, 44px) !important; }\n    .ip-platform, .featured-badge { font-size: 10px !important; padding: 8px 12px !important; }\n    .cinema-frame h3 { font-size: clamp(28px, 8vw, 44px) !important; }\n    .cinema-frame p { font-size: 14px !important; }\n    .cinema-eyebrow { font-size: 9px !important; }\n    .mocap-canvas-wrap { aspect-ratio: 4/3; min-height: 260px; }\n    .clients-orbit-wrap { aspect-ratio: 4/3; }\n    .stage-controls button { width: 30px; height: 30px; font-size: 12px; }\n    .stage-controls button[data-act=\"auto\"] { font-size: 9px; padding: 0 8px; }\n    .stage-controls { right: 8px; bottom: 8px; left: 8px; padding: 5px; gap: 4px;\n      max-width: none; justify-content: center; }\n    /* Drag/scroll hint collides with the dock on narrow screens — drop it here */\n    .stage-hint { display: none; }\n    .orbit-label { font-size: 9px; top: 12px; left: 14px; }\n    .orbit-hint { font-size: 8px; bottom: 12px; right: 14px; }\n    .mocap-hud-top, .mocap-hud-bot { padding: 12px 16px; font-size: 9px; letter-spacing: 0.18em; }\n    .mocap-hud .ticks { margin: 0 16px 12px; font-size: 8px; }\n    .mocap-data-cell { padding: 18px 14px; }\n    .mocap-data-cell .v { font-size: 18px; }\n    .stat-cell { padding: 32px 16px; }\n    .stat-cell .big { font-size: clamp(36px, 11vw, 64px) !important; }\n    .perks { grid-template-columns: 1fr !important; }\n    .submit-btn { width: 100%; }\n    .footer-grid { gap: 28px !important; }\n    .industry h3 { font-size: 16px !important; }\n    .service h3 { font-size: 18px !important; }\n    .service .icon, .service .num { font-size: 12px; }\n  }\n  @media (max-width: 400px) {\n    .hero-title { font-size: 36px; }\n    .btn-primary, .btn-ghost { padding: 11px 18px; font-size: 10px; }\n    nav.top { padding: 12px 14px; }\n    .logo span { font-size: 13px; }\n    section { padding: 36px 14px; }\n  }\n  /* Tablet sweet spot */\n  @media (min-width: 901px) and (max-width: 1100px) {\n    .hero-content { max-width: 54%; padding: 0 40px; }\n    .hero-title { font-size: clamp(36px, 5.4vw, 72px); }\n    .mocap-hero-hud { width: 42%; right: 20px; }\n  }\n  /* Touch devices: kill hover effects that misbehave */\n  @media (hover: none) {\n    .tilt-inner, .tilt-layer { transform: none !important; }\n    .magnet { transform: none !important; }\n    .cinema-rail { height: 200vh; } /* keep scrub on mobile */\n  }\n\n  /* === ALL-RATIO PASS — ultrawide, short-landscape, dynamic viewport === */\n  /* Use dynamic viewport height so mobile browser chrome never clips the hero */\n  @supports (height: 100svh) {\n    .hero { height: 100svh; }\n  }\n  /* Ultra-wide / large desktops: lift the content cap so it doesn't look lost */\n  @media (min-width: 1700px) {\n    .container { max-width: 1560px; }\n    .footer-grid, .footer-bottom { max-width: 1560px; }\n    .hero-content { padding-left: max(60px, calc((100vw - 1560px) / 2 + 60px)); }\n  }\n  @media (min-width: 2200px) {\n    .container { max-width: 1760px; }\n    .hero-title { font-size: clamp(80px, 6.4vw, 150px); }\n  }\n  /* Short & wide (landscape phones, split-screen): collapse vertical padding,\n     let the hero shrink, and reflow the side HUD inline */\n  @media (max-height: 560px) and (orientation: landscape) {\n    .hero { min-height: 0; height: auto; padding: 90px 0 36px; }\n    .mocap-hero-hud { position: relative; right: auto; top: auto; transform: none;\n      width: min(46%, 340px); margin: 0; max-height: none; }\n    section { padding: 40px 24px; }\n  }\n  /* Square-ish viewports (foldables, some tablets): keep IP visuals from\n     getting too tall by capping the poster frame height */\n  @media (min-aspect-ratio: 8/9) and (max-aspect-ratio: 9/8) and (max-width: 1000px) {\n    .featured-visual { aspect-ratio: 4/3; }\n  }\n  /* ================================================================\n     COMPREHENSIVE ALL-DEVICE RESPONSIVE PASS\n     Covers every section systematically:\n     mobile-xs (<400) | mobile (<600) | tablet (<900) | wide (<1100)\n     plus ultrawide, short-landscape, square/foldable, dynamic vh\n     ================================================================ */\n\n  /* ── Global resets that prevent horizontal overflow on any device ── */\n  *, *::before, *::after { box-sizing: border-box; }\n  /* IMPORTANT: use overflow-x: clip (NOT hidden) here. `hidden` forces the\n     other axis to compute as `auto`, making <body> a scroll container — that\n     stops window scroll events from firing and breaks all scroll-driven UI\n     (cinema scrollytelling, progress bar, reveals). `clip` clips without\n     creating a scrollport, so the window stays the scroller. */\n  html, body { overflow-x: clip; width: 100%; }\n  img, canvas, video, svg { max-width: 100%; display: block; }\n  .container { width: 100%; padding-left: max(16px, 5vw); padding-right: max(16px, 5vw); }\n\n  /* ── Nav: hamburger menu on all sub-1100 widths ── */\n  @media (max-width: 1100px) {\n    .menu-toggle { display: flex; align-items: center; justify-content: center; }\n    nav.top ul { display: none; }\n    nav.top.menu-open ul {\n      display: flex; flex-direction: column; position: absolute;\n      top: 100%; left: 0; right: 0; background: rgba(6,7,11,0.98);\n      padding: 24px max(16px,4vw); gap: 18px; border-bottom: 1px solid var(--line);\n      z-index: 200;\n    }\n    nav.top.menu-open ul li a { font-size: 13px; letter-spacing: 0.15em; }\n    .nav-cta { display: none; }\n  }\n\n  /* ── Hero section ── */\n  @media (max-width: 1100px) {\n    .hero-content { max-width: 100%; padding: 0 max(18px, 4vw); text-align: center; }\n    .hero-actions { justify-content: center; }\n    .hero-sub { margin-left: auto; margin-right: auto; }\n    .mocap-hero-hud { width: 40%; right: 16px; }\n  }\n  @media (max-width: 760px) {\n    .mocap-hero-hud { display: none; }\n    .hero-content { max-width: 100%; }\n  }\n\n  /* ── Cinema pipeline ── */\n  @media (max-width: 900px) {\n    .cinema-content { padding: 80px max(16px, 4vw) 40px; }\n    .cinema-frame { padding: 24px max(16px, 4vw); }\n  }\n  @media (max-width: 600px) {\n    .cinema-content { padding: 64px 16px 28px; grid-template-rows: auto 1fr auto; }\n    .cinema-top { font-size: 10px; }\n    .cinema-top .ct-bar { width: 60px; }\n    .cinema-frames { gap: 14px; }\n    .cinema-frame { padding: 20px 14px; }\n  }\n\n  /* ── Mocap Stage ── */\n  @media (max-width: 1100px) {\n    .mocap-canvas-wrap { aspect-ratio: 16/9; }\n  }\n  @media (max-width: 760px) {\n    .mocap-canvas-wrap { aspect-ratio: 4/3; min-height: 260px; max-height: 70svh; }\n    .stage-controls {\n      left: 8px; right: 8px; bottom: 8px; padding: 5px; gap: 6px;\n      max-width: none; justify-content: center;\n    }\n    .stage-controls button { width: 44px; height: 44px; font-size: 14px; }\n    .stage-controls button[data-act=\"auto\"] { font-size: 10px; padding: 0 14px; min-width: 52px; }\n    .stage-hint { display: none; }\n    .mocap-hud-top, .mocap-hud-bot { font-size: 9px; padding: 10px 12px; letter-spacing: 0.15em; }\n    .mocap-hud .ticks { margin: 0 12px 10px; font-size: 8px; }\n    .mocap-data-cell { padding: 14px 10px; }\n    .mocap-data-cell .v { font-size: 16px; }\n  }\n  @media (max-width: 420px) {\n    .mocap-canvas-wrap { aspect-ratio: 1/1; min-height: 280px; }\n  }\n  /* Landscape phones: tighter canvas, keep controls visible */\n  @media (max-height: 500px) and (orientation: landscape) {\n    .mocap-canvas-wrap { aspect-ratio: 21/9; min-height: 0; }\n    .mocap-hud { display: none; }\n  }\n\n  /* ── Services grid ── */\n  @media (max-width: 900px) {\n    .services-grid { grid-template-columns: 1fr; }\n    .service { min-height: auto; padding: 28px 20px; }\n    .service-3d { width: 80px; height: 80px; }\n    .service-title { font-size: 18px; }\n  }\n\n  /* ── IP / Featured section ── */\n  @media (max-width: 900px) {\n    .featured, .featured.reverse { grid-template-columns: 1fr; gap: 32px; }\n    .featured.reverse .featured-visual { order: 1; }\n    .featured.reverse .featured-info  { order: 2; }\n    .ip-meta { grid-template-columns: repeat(2, 1fr); }\n  }\n  @media (max-width: 480px) {\n    .ip-meta { grid-template-columns: 1fr; }\n    .voice-grid { grid-template-columns: 1fr; }\n  }\n\n  /* ── Media / News ── */\n  @media (max-width: 760px) {\n    .media-feature { gap: 24px; }\n    .media-feature-copy h3 { font-size: clamp(18px, 5.5vw, 26px); }\n    .media-grid { grid-template-columns: 1fr; }\n  }\n\n  /* ── Stats row ── */\n  @media (max-width: 500px) {\n    .stats-row { grid-template-columns: 1fr 1fr; }\n    .stat-cell { padding: 28px 14px; }\n    .stat-cell .big { font-size: clamp(30px, 10vw, 44px); }\n  }\n\n  /* ── Clients / logos ── */\n  @media (max-width: 600px) { .clients-grid { grid-template-columns: repeat(3, 1fr); } }\n  @media (max-width: 380px) { .clients-grid { grid-template-columns: repeat(2, 1fr); } }\n\n  /* ── Industries ── */\n  @media (max-width: 480px) {\n    .industry-grid { grid-template-columns: 1fr 1fr; }\n    .industry { aspect-ratio: 3/4; padding: 18px; }\n    .industry h3 { font-size: 14px; }\n  }\n  @media (max-width: 340px) { .industry-grid { grid-template-columns: 1fr; } }\n\n  /* Match JS WebGL-budget width threshold: hide empty service-icon boxes\n     on narrow viewports (fine-pointer laptops resized below 768px too). */\n  @media (max-width: 767px) { .service-3d { display: none; } }\n\n  /* ── About ── */\n  @media (max-width: 760px) {\n    #about-canvas { aspect-ratio: 4/3; }\n    .about-copy h2 { font-size: clamp(26px, 7vw, 44px); }\n    .about-copy p { font-size: 15px; }\n  }\n\n  /* ── Co-production banner ── */\n  @media (max-width: 700px) {\n    .copro { padding: 28px 20px; gap: 20px; grid-template-columns: 1fr; text-align: center; }\n    .copro h3 { font-size: 16px; }\n    .copro p { font-size: 14px; }\n    .copro .btn-ghost { margin: 0 auto; }\n  }\n\n  /* ── Careers ── */\n  @media (max-width: 760px) {\n    .careers-wrap { gap: 30px; }\n    .form-grid { grid-template-columns: 1fr; }\n    .field-full { grid-column: 1; }\n    .perks { grid-template-columns: 1fr; }\n  }\n\n  /* ── Contact ── */\n  @media (max-width: 600px) {\n    .contact-detail { flex-direction: column; align-items: flex-start; gap: 4px; }\n    .contact-info h2 { font-size: clamp(28px, 9vw, 48px); }\n    .locations { grid-template-columns: 1fr; }\n    .socials { flex-wrap: wrap; }\n    .coming-soon { padding: 30px 20px; }\n    .coming-soon h3 { font-size: clamp(22px, 6vw, 32px); }\n  }\n\n  /* ── Footer ── */\n  @media (max-width: 760px) {\n    footer { padding: 44px 16px 24px; }\n    .footer-grid { grid-template-columns: 1fr 1fr; gap: 28px; }\n  }\n  @media (max-width: 480px) {\n    .footer-grid { grid-template-columns: 1fr; gap: 22px; }\n    .footer-brand { grid-column: 1; }\n  }\n\n  /* ── Ultrawide (≥1700px) ── */\n  @media (min-width: 1700px) {\n    .container { max-width: 1560px; margin-left: auto; margin-right: auto; }\n    .footer-grid, .footer-bottom { max-width: 1560px; }\n    .hero-content { padding-left: max(60px, calc((100vw - 1560px) / 2 + 60px)); }\n  }\n  @media (min-width: 2200px) {\n    .container { max-width: 1760px; }\n    .hero-title { font-size: clamp(80px, 6.4vw, 150px); }\n  }\n\n  /* ── Short landscape (URL bar, split-screen) ── */\n  @media (max-height: 560px) and (orientation: landscape) {\n    .hero { min-height: 0; height: auto; padding: 80px 0 30px; }\n    .mocap-hero-hud { display: none; }\n    section { padding: 36px max(16px, 3vw); }\n  }\n\n  /* ── Square / foldable ── */\n  @media (min-aspect-ratio: 8/9) and (max-aspect-ratio: 9/8) and (max-width: 1000px) {\n    .featured-visual { aspect-ratio: 4/3; }\n    .mocap-canvas-wrap { aspect-ratio: 4/3; }\n  }\n\n  /* ── Dynamic viewport height (iOS Safari bar) ── */\n  @supports (height: 100svh) { .hero { height: 100svh; min-height: 560px; } }\n\n  /* 3D canvases: drag/zoom on desktop (fine pointer) only. On touch devices\n     the stage is auto-orbit and swipes must scroll the page — NOT get trapped. */\n  @media (pointer: fine) {\n    #mocap-canvas, #clients-orbit-canvas, .mocap-canvas-wrap, .clients-orbit-wrap {\n      touch-action: none;\n    }\n  }\n  @media (pointer: coarse) {\n    #mocap-canvas, #clients-orbit-canvas, .mocap-canvas-wrap, .clients-orbit-wrap {\n      touch-action: pan-y;\n    }\n    /* Full control on mobile too: keep rotate/zoom/auto/reset buttons. Only the\n       timecode ticker is dropped to save horizontal space on tiny screens. */\n    .mocap-hud .ticks { display: none; }\n    /* Decorative service-icon canvases are skipped on mobile (WebGL budget) —\n       hide their empty boxes so service headers stay clean. */\n    .service-3d { display: none; }\n  }\n  .reveal { opacity: 0; transform: translateY(40px); transition: opacity 1s, transform 1s; }\n  .reveal.visible { opacity: 1; transform: translateY(0); }\n\n  /* Decorative glows must never expand the page scroll width */\n  .glow { position: absolute; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0; overflow: hidden; }\n  .glow.a { width: 500px; height: 500px; background: rgba(255,77,46,0.16); top: -200px; right: -200px; }\n  .glow.b { width: 400px; height: 400px; background: rgba(0,229,255,0.10); bottom: -150px; left: -150px; }\n\n  /* ============ CINEMATIC SCROLL SYSTEMS ============ */\n\n  /* Scroll progress bar */\n  .scroll-progress {\n    position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 200;\n    background: linear-gradient(90deg, var(--accent), var(--accent-3), var(--accent-2));\n    transform-origin: left center; transform: scaleX(0);\n    transition: transform 0.1s linear;\n  }\n\n  /* Hero scroll-driven layer */\n  .hero-content { will-change: transform, opacity; }\n  .hero-canvas-wrap { position: absolute; inset: 0; z-index: 1; will-change: transform; }\n\n  /* Word-by-word reveal */\n  .word-reveal { display: inline-block; overflow: hidden; padding: 0.04em 0; }\n  .word-reveal > span {\n    display: inline-block; transform: translateY(110%);\n    animation: wordUp 1s cubic-bezier(.2,.7,.2,1) forwards;\n  }\n  @keyframes wordUp { to { transform: translateY(0); } }\n\n  /* ============ PIPELINE CINEMA — Apple-style scrollytelling ============ */\n  .cinema {\n    position: relative; background: var(--bg);\n    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);\n    margin-bottom: 0;\n  }\n  .cinema-rail { position: relative; height: 380vh; }\n  .cinema-stage {\n    position: sticky; top: 0; height: 100vh; overflow: hidden;\n    display: block;\n  }\n  #cinema-canvas {\n    position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1;\n  }\n  /* Per-chapter color wash that crossfades */\n  .cinema-color-wash {\n    position: absolute; inset: 0; z-index: 0;\n    transition: background 1.2s cubic-bezier(.4,0,.2,1);\n    background: radial-gradient(ellipse at 30% 50%, rgba(255,77,46,0.18), transparent 60%),\n                radial-gradient(ellipse at 70% 60%, rgba(0,229,255,0.08), transparent 55%);\n  }\n  .cinema-color-wash[data-stage=\"0\"] { background: radial-gradient(ellipse at 30% 50%, rgba(255,77,46,0.22), transparent 60%), radial-gradient(ellipse at 70% 70%, rgba(255,170,46,0.10), transparent 55%); }\n  .cinema-color-wash[data-stage=\"1\"] { background: radial-gradient(ellipse at 30% 50%, rgba(0,229,255,0.22), transparent 60%), radial-gradient(ellipse at 70% 70%, rgba(178,102,255,0.12), transparent 55%); }\n  .cinema-color-wash[data-stage=\"2\"] { background: radial-gradient(ellipse at 30% 50%, rgba(178,102,255,0.22), transparent 60%), radial-gradient(ellipse at 70% 70%, rgba(0,229,255,0.10), transparent 55%); }\n  .cinema-color-wash[data-stage=\"3\"] { background: radial-gradient(ellipse at 30% 50%, rgba(255,170,46,0.20), transparent 60%), radial-gradient(ellipse at 70% 70%, rgba(255,77,46,0.18), transparent 55%); }\n  .cinema-color-wash[data-stage=\"4\"] { background: radial-gradient(ellipse at 30% 50%, rgba(255,77,46,0.20), transparent 55%), radial-gradient(ellipse at 70% 70%, rgba(255,255,255,0.06), transparent 60%); }\n\n  /* Headline area centered on screen */\n  .cinema-content {\n    position: absolute; inset: 0; z-index: 2;\n    display: grid; grid-template-rows: auto 1fr auto; padding: 110px 60px 60px;\n    pointer-events: none;\n  }\n  @media (max-width: 900px) { .cinema-content { padding: 100px 22px 50px; } }\n\n  .cinema-top {\n    display: flex; align-items: center; justify-content: space-between;\n    font-family: 'Syncopate', sans-serif; font-size: 11px; letter-spacing: 0.5em;\n    text-transform: uppercase; color: rgba(255,255,255,0.6);\n  }\n  .cinema-top .eb { color: var(--accent); }\n  .cinema-top .ct {\n    display: flex; align-items: center; gap: 18px;\n  }\n  .cinema-top .ct-bar {\n    width: 120px; height: 2px; background: rgba(255,255,255,0.12); position: relative; overflow: hidden;\n  }\n  .cinema-top .ct-bar i {\n    position: absolute; left: 0; top: 0; height: 100%; background: var(--accent);\n    transform-origin: left; transform: scaleX(0); transition: transform 0.3s linear;\n  }\n\n  .cinema-frames {\n    position: relative; align-self: center; justify-self: start;\n    max-width: 1100px; width: 100%;\n    min-height: 44vh;\n  }\n  @media (max-width: 600px) { .cinema-frames { min-height: 56vh; } }\n  .cinema-frame {\n    position: absolute; inset: 0; opacity: 0;\n    transform: translateY(60px);\n    transition: opacity 0.7s cubic-bezier(.2,.7,.2,1), transform 0.9s cubic-bezier(.2,.7,.2,1);\n    pointer-events: none;\n  }\n  .cinema-frame.active {\n    opacity: 1; transform: translateY(0);\n    pointer-events: auto;\n  }\n  .cinema-frame .step-num {\n    font-family: 'Syncopate', sans-serif; font-size: 13px;\n    color: rgba(255,255,255,0.45); letter-spacing: 0.5em; margin-bottom: 22px;\n    text-transform: uppercase;\n  }\n  .cinema-frame .step-num .accent {\n    color: var(--accent); margin-right: 14px;\n    font-size: 22px; font-weight: 800;\n  }\n  .cinema-frame h3 {\n    font-family: 'Syncopate', sans-serif; font-weight: 700;\n    font-size: clamp(40px, 7vw, 96px); line-height: 0.94; letter-spacing: -0.025em;\n    text-transform: uppercase; margin-bottom: 28px; max-width: 14ch;\n    background: linear-gradient(180deg, #fff 30%, #888 100%);\n    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;\n  }\n  .cinema-frame h3 .accent { -webkit-text-fill-color: var(--accent); color: var(--accent); }\n  .cinema-frame p {\n    color: rgba(255,255,255,0.78); font-size: clamp(15px, 1.4vw, 19px);\n    max-width: 580px; line-height: 1.7;\n  }\n\n  /* Right-side persistent chapter list */\n  .cinema-chapters {\n    position: absolute; right: 60px; top: 50%; transform: translateY(-50%);\n    z-index: 3; display: flex; flex-direction: column; gap: 8px;\n    pointer-events: auto;\n  }\n  @media (max-width: 1100px) { .cinema-chapters { right: 30px; } }\n  @media (max-width: 700px)  { .cinema-chapters { display: none; } }\n  .cinema-chapter {\n    display: flex; align-items: center; gap: 14px;\n    font-family: 'Syncopate', sans-serif; font-size: 10px;\n    letter-spacing: 0.32em; text-transform: uppercase;\n    color: rgba(255,255,255,0.35); cursor: pointer;\n    transition: color 0.4s, transform 0.4s;\n    padding: 6px 0;\n  }\n  .cinema-chapter .ch-line {\n    width: 24px; height: 1px; background: rgba(255,255,255,0.22); transition: all 0.4s;\n  }\n  .cinema-chapter .ch-num {\n    width: 28px; font-weight: 700; color: rgba(255,255,255,0.55);\n  }\n  .cinema-chapter:hover { color: rgba(255,255,255,0.7); }\n  .cinema-chapter.active {\n    color: #fff; transform: translateX(-4px);\n  }\n  .cinema-chapter.active .ch-line { width: 56px; background: var(--accent); }\n  .cinema-chapter.active .ch-num { color: var(--accent); }\n  .cinema-chapter.done .ch-line { background: rgba(255,77,46,0.5); }\n\n  /* Bottom controls */\n  .cinema-bottom {\n    display: flex; align-items: flex-end; justify-content: space-between; gap: 28px;\n    pointer-events: auto;\n  }\n  .cinema-scrubber {\n    flex: 1; display: flex; gap: 4px;\n  }\n  .cinema-segment {\n    flex: 1; height: 3px; background: rgba(255,255,255,0.10);\n    position: relative; overflow: hidden; cursor: pointer;\n    transition: height 0.2s, background 0.3s;\n  }\n  .cinema-segment:hover { background: rgba(255,255,255,0.18); }\n  .cinema-segment.done { background: rgba(255,77,46,0.55); }\n  .cinema-segment.active i {\n    position: absolute; left: 0; top: 0; height: 100%; width: 100%;\n    background: var(--accent); transform-origin: left; transform: scaleX(var(--p, 0));\n  }\n  .cinema-scroll-cue {\n    font-family: 'Syncopate', sans-serif; font-size: 10px; letter-spacing: 0.4em;\n    color: rgba(255,255,255,0.45); text-transform: uppercase;\n    display: flex; align-items: center; gap: 10px;\n    animation: scrollNudge 2.4s ease-in-out infinite;\n  }\n  .cinema-scroll-cue::after {\n    content: ''; display: inline-block; width: 1px; height: 22px;\n    background: linear-gradient(180deg, var(--accent), transparent);\n  }\n  @keyframes scrollNudge {\n    0%, 100% { transform: translateY(0); opacity: 0.55; }\n    50% { transform: translateY(6px); opacity: 1; }\n  }\n  /* Hide cue once user has scrolled past first stage */\n  .cinema.engaged .cinema-scroll-cue { opacity: 0; transition: opacity 0.5s; }\n\n  /* Mobile cinema layout — stack, no right rail, smaller type */\n  @media (max-width: 900px) {\n    .cinema-rail { height: 320vh; }\n    .cinema-content { padding: 90px 20px 30px; }\n    .cinema-frame h3 { font-size: clamp(32px, 9vw, 56px); }\n  }\n  @media (max-width: 600px) {\n    .cinema-rail { height: 300vh; }\n    .cinema-frame .step-num { font-size: 11px; letter-spacing: 0.3em; }\n    .cinema-frame .step-num .accent { font-size: 18px; }\n    .cinema-frame p { font-size: 14px !important; }\n    .cinema-top { font-size: 9px; letter-spacing: 0.3em; }\n    .cinema-top .ct-bar { width: 80px; }\n  }\n\n  /* Magnetic CTAs */\n  .magnet { will-change: transform; }\n\n  /* 3D tilt parallax */\n  .tilt { perspective: 1400px; perspective-origin: 50% 50%; }\n  .tilt-inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 0.2s ease-out; }\n  .tilt-layer { transform-style: preserve-3d; }\n  .tilt-layer[data-depth] { transition: transform 0.2s ease-out; }\n\n  /* Mocap Stage section */\n  .mocap-stage-section {\n    position: relative; padding: clamp(40px, 6vw, 88px) clamp(16px, 5vw, 60px);\n    background: linear-gradient(180deg, #06070b 0%, #0a0d18 50%, #06070b 100%);\n    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);\n    overflow: hidden;\n  }\n  /* ── Mocap canvas wrap is a CONTAINER. Everything inside (HUD, controls,\n     corners, ticks) sizes in `cqw`/`cqmin` so it scales with the canvas\n     itself — identical proportions on phone, tablet, laptop and TV. The\n     aspect-ratio cascade below picks a sensible shape per viewport. ── */\n  .mocap-canvas-wrap {\n    position: relative; aspect-ratio: 21/9;\n    width: 100%; max-width: min(1500px, 96vw); margin: 0 auto;\n    min-height: clamp(240px, 38vw, 460px);\n    border-radius: 8px; overflow: hidden; border: 1px solid var(--line);\n    background: radial-gradient(ellipse at center, #14081c 0%, #06070b 80%);\n    box-shadow: 0 60px 120px -40px rgba(255,77,46,0.25), 0 0 0 1px rgba(255,77,46,0.08);\n    container-type: size; container-name: mocap;\n  }\n\n  /* Stage controls dock — sizes in container units, always inside the canvas */\n  .stage-controls {\n    position: absolute; right: clamp(8px, 1.6cqw, 16px); bottom: clamp(8px, 1.6cqw, 16px); z-index: 5;\n    display: flex; flex-wrap: wrap; justify-content: flex-end;\n    gap: clamp(4px, 0.7cqw, 6px); padding: clamp(4px, 0.9cqw, 8px);\n    max-width: calc(100% - 16px);\n    background: rgba(8,10,16,0.85); border: 1px solid rgba(255,255,255,0.08);\n    backdrop-filter: blur(8px); border-radius: 6px;\n  }\n  .stage-controls button {\n    width: clamp(34px, 5.4cqw, 40px); height: clamp(34px, 5.4cqw, 40px); flex: 0 0 auto;\n    background: transparent; border: 1px solid rgba(255,255,255,0.12);\n    color: var(--ink); font-family: 'Syncopate', sans-serif;\n    font-size: clamp(12px, 1.9cqw, 15px); letter-spacing: 0.1em; line-height: 1; padding: 0;\n    display: flex; align-items: center; justify-content: center;\n    transition: all 0.2s; box-sizing: border-box; white-space: nowrap; border-radius: 4px;\n  }\n  /* AUTO is a word, not a glyph — size to its label so it stays inside the dock */\n  .stage-controls button[data-act=\"auto\"] {\n    width: auto; min-width: clamp(40px, 6.4cqw, 52px);\n    padding: 0 clamp(8px, 1.4cqw, 14px); font-size: clamp(9px, 1.4cqw, 11px); letter-spacing: 0.18em;\n  }\n  .stage-controls button:hover { border-color: var(--accent); color: var(--accent); background: rgba(255,77,46,0.06); }\n  .stage-controls button.active { background: var(--accent); color: #fff; border-color: var(--accent); }\n  .stage-controls .sep { width: 1px; background: rgba(255,255,255,0.08); margin: 4px 2px; }\n  .stage-hint {\n    position: absolute; left: clamp(8px, 1.6cqw, 16px); bottom: clamp(8px, 1.6cqw, 16px); z-index: 5;\n    font-family: 'Syncopate', sans-serif; font-size: clamp(7px, 1cqw, 9px); letter-spacing: 0.3em;\n    color: rgba(255,255,255,0.45); text-transform: uppercase;\n    background: rgba(8,10,16,0.7); padding: clamp(5px, 1cqw, 8px) clamp(8px, 1.4cqw, 12px); border: 1px solid rgba(255,255,255,0.08);\n  }\n  .stage-hint .k {\n    color: var(--accent); border: 1px solid rgba(255,77,46,0.5); padding: 1px 5px;\n    margin: 0 4px;\n  }\n  #mocap-canvas { position: absolute; inset: 0; }\n  .mocap-hud {\n    position: absolute; inset: 0; z-index: 2; pointer-events: none;\n    display: grid; grid-template-rows: auto 1fr auto;\n  }\n  .mocap-hud-top, .mocap-hud-bot {\n    padding: clamp(10px, 2.2cqw, 20px) clamp(12px, 2.6cqw, 28px); display: flex; justify-content: space-between; gap: 12px;\n    font-family: 'Syncopate', sans-serif; font-size: clamp(7px, 1.15cqw, 10px);\n    letter-spacing: clamp(0.12em, 0.35cqw, 0.3em); color: rgba(255,255,255,0.5); text-transform: uppercase;\n  }\n  .mocap-hud .rec {\n    display: inline-flex; align-items: center; gap: 8px; color: var(--accent);\n  }\n  .mocap-hud .rec::before {\n    content: ''; width: clamp(6px, 0.9cqw, 8px); height: clamp(6px, 0.9cqw, 8px); border-radius: 50%;\n    background: var(--accent); animation: pulse 1.4s ease-in-out infinite;\n  }\n  .mocap-hud .ticks {\n    position: relative; align-self: end; margin: 0 clamp(12px, 2.6cqw, 28px) clamp(10px, 2cqw, 20px);\n    height: clamp(12px, 1.8cqw, 18px); border-bottom: 1px solid rgba(255,255,255,0.12);\n    display: flex; align-items: flex-end; justify-content: space-between;\n    font-family: 'Syncopate', sans-serif; font-size: clamp(6px, 1cqw, 9px); letter-spacing: 0.2em;\n    color: rgba(255,255,255,0.4);\n  }\n  .mocap-hud .ticks span { padding-bottom: 4px; }\n  .mocap-corner {\n    position: absolute; width: clamp(12px, 2.2cqw, 22px); height: clamp(12px, 2.2cqw, 22px);\n    border: 1px solid rgba(255,77,46,0.6);\n  }\n  .mocap-corner.tl { top: clamp(8px,1.4cqw,12px); left: clamp(8px,1.4cqw,12px); border-right: none; border-bottom: none; }\n  .mocap-corner.tr { top: clamp(8px,1.4cqw,12px); right: clamp(8px,1.4cqw,12px); border-left: none; border-bottom: none; }\n  .mocap-corner.bl { bottom: clamp(8px,1.4cqw,12px); left: clamp(8px,1.4cqw,12px); border-right: none; border-top: none; }\n  .mocap-corner.br { bottom: clamp(8px,1.4cqw,12px); right: clamp(8px,1.4cqw,12px); border-left: none; border-top: none; }\n  .mocap-data {\n    display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;\n    background: var(--line); border: 1px solid var(--line); margin-top: 40px;\n    max-width: min(1500px, 96vw); margin-left: auto; margin-right: auto;\n  }\n  @media (max-width: 700px) { .mocap-data { grid-template-columns: repeat(2, 1fr); } }\n  .mocap-data-cell {\n    background: rgba(10,12,20,0.6); padding: 24px 20px;\n  }\n  .mocap-data-cell .l {\n    font-family: 'Syncopate', sans-serif; font-size: 10px; letter-spacing: 0.3em;\n    color: var(--ink-dim); margin-bottom: 10px; text-transform: uppercase;\n  }\n  .mocap-data-cell .v {\n    font-family: 'Syncopate', sans-serif; font-size: 22px; color: var(--ink);\n  }\n  .mocap-data-cell .v .accent { color: var(--accent); }\n\n  /* ================================================================\n     MOCAP STAGE — CONSOLIDATED RESPONSIVE CASCADE\n     Placed AFTER the base rule so these win by source order (the earlier\n     scattered overrides were defeated by the base 21/9 rule and never\n     applied — that's why the stage stayed an ultra-wide strip on phones).\n     Aspect shape adapts: TV/desktop 21/9 → laptop 16/9 → tablet 3/2 →\n     portrait/phone 4/3 → tiny 1/1. Container-query units (above) keep the\n     HUD/controls proportional at every one of these shapes.\n     ================================================================ */\n  @media (max-width: 1280px) { .mocap-canvas-wrap { aspect-ratio: 16/9; } }\n  @media (max-width: 900px)  { .mocap-canvas-wrap { aspect-ratio: 3/2; } }\n  @media (max-width: 680px)  { .mocap-canvas-wrap { aspect-ratio: 4/3; min-height: clamp(260px, 64vw, 380px); } }\n  @media (max-width: 430px)  { .mocap-canvas-wrap { aspect-ratio: 1/1; } }\n  /* Landscape phones / short windows: go wide-and-short, hide flavor HUD */\n  @media (max-height: 520px) and (orientation: landscape) {\n    .mocap-canvas-wrap { aspect-ratio: 21/9; min-height: 0; }\n    .mocap-hud-top, .mocap-hud-bot, .mocap-hud .ticks { display: none; }\n  }\n  /* Touch devices: enforce ≥44px hit targets regardless of container size,\n     and centre the dock for thumb reach. Rotate buttons + ticks already\n     hidden by the pointer:coarse block elsewhere (auto-orbit is the show). */\n  @media (pointer: coarse) {\n    .stage-controls { left: 8px; right: 8px; bottom: 8px; justify-content: center; max-width: calc(100% - 16px); }\n    .stage-controls button { width: 44px; height: 44px; font-size: 16px; }\n    .stage-controls button[data-act=\"auto\"] { width: auto; min-width: 52px; font-size: 11px; }\n  }\n  /* Big TVs / 4K: cap the stage so it stays a premium centred panel, not a\n     wall-to-wall band; data row matches its width. */\n  @media (min-width: 1900px) {\n    .mocap-canvas-wrap, .mocap-data { max-width: 1600px; }\n  }\n  @media (min-width: 2600px) {\n    .mocap-canvas-wrap, .mocap-data { max-width: 1900px; }\n  }\n\n  /* Clients 3D orbit */\n  .clients-orbit-wrap {\n    position: relative; aspect-ratio: l\">\n      <div class=\"logo\">\n        <img class=\"logo-mark\" src=\"e884c07d-958c-4740-a463-7671dfb7c6d9\" alt=\"Atheorem\">\n        <span>ATHEOREM<\u002Fspan>\n      <\u002Fdiv>\n      <p>A full-spectrum AVGCXR creative powerhouse — Animation, VFX, Gaming, Comics, AI Video Gen, Extended Reality &amp; Live Action Filmmaking. From story to screen excellence.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"footer-col\"><h4>Studio<\u002Fh4><ul>\n      <li><a href=\"#about\">About<\u002Fa><\u002Fli><li><a href=\"#services\">Services<\u002Fa><\u002Fli>\n      <li><a href=\"#industries\">Industries<\u002Fa><\u002Fli><li><a href=\"#careers\">Careers<\u002Fa><\u002Fli>\n    <\u002Ful><\u002Fdiv>\n    <div class=\"footer-col\"><h4>Work<\u002Fh4><ul>\n      <li><a href=\"#ip\">Dhira<\u002Fa><\u002Fli><li><a href=\"#ip\">Abhimanyu<\u002Fa><\u002Fli>\n      <li><a href=\"#media\">Media<\u002Fa><\u002Fli><li><a href=\"#clients\">Clients<\u002Fa><\u002Fli>\n    <\u002Ful><\u002Fdiv>\n    <div class=\"footer-col\"><h4>Coming Soon<\u002Fh4><ul>\n      <li><a href=\"#store\">ATS.Store<\u002Fa><\u002Fli><li><a href=\"#store\">ACU.TV<\u002Fa><\u002Fli>\n    <\u002Ful><\u002Fdiv>\n    <div class=\"footer-col\"><h4>Connect<\u002Fh4><ul>\n      <li><a href=\"https://www.youtube.com/channel/UCxS22iFWVgo2RZjwRcsOkrA\" target=\"_blank\" rel=\"noopener\">YouTube<\u002Fa><\u002Fli>\n      <li><a href=\"https://www.instagram.com/ATheoremStudios/\" target=\"_blank\" rel=\"noopener\">Instagram<\u002Fa><\u002Fli>\n      <li><a href=\"https://in.linkedin.com/company/atheoremstudios\" target=\"_blank\" rel=\"noopener\">LinkedIn<\u002Fa><\u002Fli>\n      <li><a href=\"https://x.com/ATheoremStudios\" target=\"_blank\" rel=\"noopener\">X / Twitter<\u002Fa><\u002Fli>\n    <\u002Ful><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"footer-bottom\">\n    <div>© 2026 ATHEOREM STUDIOS. All rights reserved.<\u002Fdiv>\n    <div>Crafted in Hyderabad &amp; Warangal · From Story to Screen Excellence<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script src=\"280c0b35-2034-4d87-accc-3a4a0121bad8\"><\u002Fscript>\n<script>\n/* ============================================================\n   GLOBAL PERFORMANCE GATE\n   The page runs ~8 independent WebGL contexts, each with its own\n   rAF loop. Drawing them all every frame — even off-screen or with\n   the tab hidden — is the dominant cost. We patch the renderer once\n   so any draw call is skipped unless its canvas is on-screen AND the\n   tab is visible, and cap device-pixel-ratio on small screens.\n   One patch ⇒ every scene benefits, no per-loop edits needed.\n   ============================================================ */\n(function () {\n  if (typeof THREE === 'undefined') return;\n  // Per-canvas on-screen flag, kept current by a shared IntersectionObserver.\n  const vis = new WeakMap();\n  const io = new IntersectionObserver((entries) => {\n    entries.forEach((e) => vis.set(e.target, e.isIntersecting));\n  }, { rootMargin: '160px' });\n\n  // Tab visibility — pause ALL draws when the page is backgrounded.\n  let pageVisible = document.visibilityState !== 'hidden';\n  document.addEventListener('visibilitychange', () => {\n    pageVisible = document.visibilityState !== 'hidden';\n  });\n\n  // Respect reduced-motion + small-screen budgets via a tighter DPR cap.\n  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;\n  const dprCap = window.innerWidth < 768 || reduce ? 1.25 : 2;\n  const origSPR = THREE.WebGLRenderer.prototype.setPixelRatio;\n  THREE.WebGLRenderer.prototype.setPixelRatio = function (r) {\n    return origSPR.call(this, Math.min(r || 1, dprCap));\n  };\n\n  const origRender = THREE.WebGLRenderer.prototype.render;\n  THREE.WebGLRenderer.prototype.render = function (scene, cam) {\n    const cv = this.domElement;\n    if (cv && !vis.has(cv)) { io.observe(cv); vis.set(cv, true); } // start watching, assume visible until told\n    if (!pageVisible) return;                  // tab hidden → no GPU work\n    if (cv && vis.get(cv) === false) return;   // scrolled off-screen → no GPU work\n    return origRender.call(this, scene, cam);\n  };\n\n  /* Coalesce every window 'resize' listener into ONE debounced pass.\n     iOS/Android fire resize as the URL bar shows/hides while scrolling;\n     with ~10 WebGL setSize handlers that means buffer-realloc storms.\n     Debouncing collapses each burst into a single reflow once settled. */\n  const origAEL = window.addEventListener.bind(window);\n  const resizeCbs = [];\n  let resizeTimer = null;\n  const flushResize = () => { const ev = new Event('resize'); resizeCbs.forEach((fn) => { try { fn(ev); } catch (_) {} }); };\n  window.addEventListener = function (type, fn, opts) {\n    if (type === 'resize' && typeof fn === 'function') { resizeCbs.push(fn); return; }\n    return origAEL(type, fn, opts);\n  };\n  const onViewportChange = () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(flushResize, 120); };\n  origAEL('resize', onViewportChange, { passive: true });\n  origAEL('orientationchange', () => setTimeout(flushResize, 200), { passive: true });\n})();\n\n/* ============================================================\n   MOBILE WEBGL CONTEXT BUDGET\n   Browsers cap concurrent WebGL contexts (~16 desktop, often ~8\n   on mobile) and silently kill the oldest when exceeded\n   (\"Context Lost\"), blanking canvases. This page has ~14 scenes.\n   On phones/tablets we skip the purely-decorative, zero-interaction\n   scenes (about wireframe, service icons, poster flourishes, contact\n   particles) so only the key/interactive ones remain (hero, cinema,\n   mocap, clients orbit) — well under the limit, and far lighter.\n   ============================================================ */\nwindow.__LITE_GFX = matchMedia('(pointer: coarse)').matches || window.innerWidth < 768;\n// Purely-decorative 3D (about wireframe, service-card icons, contact particles)\n// is disabled on ALL devices to keep the live WebGL-context count at 4\n// (hero, cinema, mocap, clients) — well under every browser's cap, so contexts\n// never get killed/restored. These sections keep their CSS gradients + emoji.\nwindow.__SKIP_DECOR_GL = true;\n\nwindow.addEventListener('load', () => {\n  setTimeout(() => document.getElementById('loader').classList.add('hidden'), 600);\n});\n\nconst cursor = document.getElementById('cursor');\nlet mx = 0, my = 0, cx = 0, cy = 0;\nconst finePointer = matchMedia('(pointer: fine)').matches;\nwindow.addEventListener('mousemove', (e) => { mx = e.clientX; my = e.clientY; });\nfunction tickCursor() {\n  cx += (mx - cx) * 0.18; cy += (my - cy) * 0.18;\n  cursor.style.left = cx + 'px'; cursor.style.top = cy + 'px';\n  if (document.visibilityState !== 'hidden') requestAnimationFrame(tickCursor);\n  else setTimeout(() => requestAnimationFrame(tickCursor), 250);\n}\n// Custom cursor only makes sense with a fine pointer; skip the loop entirely otherwise.\nif (finePointer) { tickCursor(); } else if (cursor) { cursor.style.display = 'none'; }\ndocument.querySelectorAll('a, button, .service, .industry, input, textarea, select, .social, .client-cell').forEach(el => {\n  el.addEventListener('mouseenter', () => cursor.classList.add('hover'));\n  el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));\n});\nwindow.addEventListener('mousedown', () => cursor.classList.add('click'));\nwindow.addEventListener('mouseup', () => cursor.classList.remove('click'));\ndocument.addEventListener('mouseleave', () => cursor.style.opacity = '0');\ndocument.addEventListener('mouseenter', () => cursor.style.opacity = '1');\n\nlet navRaf = null;\nwindow.addEventListener('scroll', () => {\n  if (navRaf) return;\n  navRaf = requestAnimationFrame(() => {\n    navRaf = null;\n    const nav = document.getElementById('topnav');\n    if (window.scrollY > 40) nav.classList.add('scrolled'); else nav.classList.remove('scrolled');\n  });\n}, { passive: true });\n\nconst observer = new IntersectionObserver((entries) => {\n  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });\n}, { threshold: 0.12 });\ndocument.querySelectorAll('.reveal').forEach(el => observer.observe(el));\n\ndocument.querySelectorAll('.service').forEach(card => {\n  card.addEventListener('mousemove', (e) => {\n    const r = card.getBoundingClientRect();\n    card.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');\n    card.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');\n  });\n});\n\ndocument.querySelectorAll('a[href^=\"#\"]').forEach(a => {\n  a.addEventListener('click', (e) => {\n    const id = a.getAttribute('href');\n    if (id.length > 1) {\n      const t = document.querySelector(id);\n      if (t) {\n        e.preventDefault();\n        t.scrollIntoView({ behavior: 'smooth' });\n        document.getElementById('topnav').classList.remove('menu-open');\n      }\n    }\n  });\n});\n\n/* ============================================================\n   GOOGLE FORM LINKS\n   Paste your two Google Form URLs here. Everything else updates\n   automatically (both buttons + their hrefs).\n   ============================================================ */\nwindow.ATHEOREM_FORMS = {\n  // \"Join the theorem\" — careers / job application form\n  careers: \"https://docs.google.com/forms/d/e/1FAIpQLSdiuQsi7Mzgx8OQvpVIaG0WJxeiirtrVUe43Zi8nA9YW_HlNg/viewform\",\n  // \"Tell us about your project\" — contact / project inquiry form\n  contact: \"https://docs.google.com/forms/d/e/1FAIpQLSclZrymMEqiZUseA5dmkJ0qV3YEwC9l2bX4Yp4-HgzcKv12PQ/viewform\"\n};\n(function wireFormLinks(){\n  const c = window.ATHEOREM_FORMS || {};\n  document.querySelectorAll('[data-form-link]').forEach(a => {\n    const key = a.getAttribute('data-form-link');\n    if (c[key]) { a.href = c[key]; a.target = '_blank'; a.rel = 'noopener'; }\n  });\n})();\n\nconst counted = new WeakSet();\nconst statObserver = new IntersectionObserver((entries) => {\n  entries.forEach(en => {\n    if (!en.isIntersecting || counted.has(en.target)) return;\n    counted.add(en.target);\n    const target = +en.target.dataset.count;\n    if (!target) return;\n    const span = en.target.querySelector('span:first-child');\n    let cur = 0; const step = Math.max(1, Math.floor(target / 30));\n    const t = setInterval(() => {\n      cur += step;\n      if (cur >= target) { cur = target; clearInterval(t); }\n      span.textContent = cur;\n    }, 30);\n  });\n}, { threshold: 0.4 });\ndocument.querySelectorAll('.big[data-count]').forEach(el => statObserver.observe(el));\n\n\n/* ============ INTERACTIVE MOTION-CONTROL PERFORMER (HERO) ============ */\n/* Performer renders INSIDE the live mocap HUD box (right side).\n   Mocap cameras + capture beams + dust render on the fullscreen hero canvas,\n   positioned in world-space so they appear OUTSIDE the HUD box.            */\n(function heroScene() {\n  if (typeof THREE === 'undefined') return;\n\n  // ============= SCENE A: PERFORMER (renders into the live mocap box) =============\n  const perfCanvas = document.getElementById('hero-performer-canvas');\n  const perfScene = new THREE.Scene();\n  perfScene.fog = new THREE.FogExp2(0x06070b, 0.07);\n  const perfCam = new THREE.PerspectiveCamera(38, 4/5, 0.1, 100);\n  perfCam.position.set(0, 0.2, 5.6);\n  const perfRenderer = new THREE.WebGLRenderer({ canvas: perfCanvas, antialias: true, alpha: true });\n  perfRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\n  perfRenderer.setClearColor(0x000000, 0);\n\n  perfScene.add(new THREE.AmbientLight(0xffffff, 0.28));\n  const pKey = new THREE.PointLight(0xff4d2e, 2.4, 20); pKey.position.set(3, 3, 3); perfScene.add(pKey);\n  const pFill = new THREE.PointLight(0x00e5ff, 1.6, 20); pFill.position.set(-3, 1, 3); perfScene.add(pFill);\n  const pRim = new THREE.PointLight(0xb266ff, 1.2, 20); pRim.position.set(0, -2, -3); perfScene.add(pRim);\n  const pTop = new THREE.SpotLight(0xffffff, 1.0, 20, Math.PI/6, 0.4); pTop.position.set(0, 6, 1.5); pTop.target.position.set(0, 0, 0); perfScene.add(pTop); perfScene.add(pTop.target);\n\n  // Floor grid inside the box\n  const pGrid = new THREE.GridHelper(8, 12, 0x445065, 0x1a2030);\n  pGrid.position.y = -1.55;\n  pGrid.material.transparent = true; pGrid.material.opacity = 0.45;\n  perfScene.add(pGrid);\n  const pDisc = new THREE.Mesh(\n    new THREE.CircleGeometry(1.6, 64),\n    new THREE.MeshBasicMaterial({ color: 0xff4d2e, transparent: true, opacity: 0.07 })\n  );\n  pDisc.rotation.x = -Math.PI / 2; pDisc.position.y = -1.54; perfScene.add(pDisc);\n\n  // ---- PERFORMER — scaled to ~70% (normal height inside the box)\n  const perf = new THREE.Group(); perfScene.add(perf);\n  perf.position.set(0, -0.4, 0);\n  perf.scale.setScalar(0.62);\n\n  const rig = {\n    head:   [0,  1.85, 0],   headT: [0, 2.10, 0],\n    neck:   [0,  1.45, 0],\n    chest:  [0,  1.0,  0],\n    spine:  [0,  0.55, 0],\n    hip:    [0,  0.1,  0],\n    sL: [-0.50, 1.32, 0], sR: [0.50, 1.32, 0],\n    eL: [-0.90, 0.78, 0.1], eR: [0.90, 0.78, 0.1],\n    wL: [-1.15, 0.22, 0.25], wR: [1.15, 0.22, 0.25],\n    fL: [-1.32, 0.04, 0.3],  fR: [1.32, 0.04, 0.3],\n    hL: [-0.25, 0.1, 0], hR: [0.25, 0.1, 0],\n    kL: [-0.28,-0.78, 0.1], kR: [0.28,-0.78, 0.1],\n    aL: [-0.30,-1.7, 0.18], aR: [0.30,-1.7, 0.18],\n    tL: [-0.32,-1.82, 0.32], tR: [0.32,-1.82, 0.32]\n  };\n  const bones = [\n    ['headT','head'],['head','neck'],['neck','chest'],['chest','spine'],['spine','hip'],\n    ['neck','sL'],['neck','sR'],\n    ['sL','eL'],['eL','wL'],['wL','fL'],\n    ['sR','eR'],['eR','wR'],['wR','fR'],\n    ['hip','hL'],['hip','hR'],\n    ['hL','kL'],['kL','aL'],['aL','tL'],\n    ['hR','kR'],['kR','aR'],['aR','tR']\n  ];\n  const markerMat = new THREE.MeshBasicMaterial({ color: 0xfff5dc });\n  const markers = {};\n  Object.entries(rig).forEach(([k, p]) => {\n    const m = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 12), markerMat);\n    m.position.set(...p); m.userData = { base: [...p] PI / 2; ring2.position.y = -1.82; perf.add(ring2);\n\n  // Cursor target indicator (inside the box)\n  const targetGroup = new THREE.Group(); perfScene.add(targetGroup);\n  const targetCore = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), new THREE.MeshBasicMaterial({ color: 0xff4d2e }));\n  targetGroup.add(targetCore);\n  const targetRing = new THREE.Mesh(new THREE.RingGeometry(0.12, 0.14, 32),\n    new THREE.MeshBasicMaterial({ color: 0xff4d2e, transparent: true, opacity: 0.7, side: THREE.DoubleSide }));\n  targetGroup.add(targetRing);\n  const targetRing2 = new THREE.Mesh(new THREE.RingGeometry(0.22, 0.24, 32),\n    new THREE.MeshBasicMaterial({ color: 0xff4d2e, transparent: true, opacity: 0.3, side: THREE.DoubleSide }));\n  targetGroup.add(targetRing2);\n\n  // ============= SCENE B: MOCAP CAMERAS (renders fullscreen, around the box) =============\n  const camCanvas = document.getElementById('hero-canvas');\n  const camScene = new THREE.Scene();\n  camScene.fog = new THREE.FogExp2(0x06070b, 0.04);\n  const camCam = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);\n  camCam.position.set(0, 0, 8);\n  const camRenderer = new THREE.WebGLRenderer({ canvas: camCanvas, antialias: true, alpha: true });\n  camRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\n  camRenderer.setClearColor(0x06070b, 1);\n\n  camScene.add(new THREE.AmbientLight(0xffffff, 0.35));\n  const cKey = new THREE.PointLight(0xff4d2e, 1.8, 25); cKey.position.set(2, 3, 4); camScene.add(cKey);\n  const cFill = new THREE.PointLight(0x00e5ff, 1.4, 25); cFill.position.set(-4, 0, 3); camScene.add(cFill);\n\n  // Mocap cameras live OUTSIDE the HUD box.\n  // HUD box occupies world X roughly [+0.5, +5] at z=0 — we place cameras in the\n  // left half of the hero ([-6, 0]) plus a few above / below the box on the right.\n  const camDots = [];\n  const camHousingMat = new THREE.MeshStandardMaterial({ color: 0x1a1f2a, metalness: 0.9, roughness: 0.3 });\n  // Box-center in fullscreen-canvas world space (where the cameras \"look\")\n  const boxAnchor = new THREE.Vector3(3.2, 0.0, 0);\n\n  // Left-side arc (6 cameras)\n  for (let i = 0; i < 6; i++) {\n    const angle = -Math.PI * 0.85 + (i / 5) * Math.PI * 0.7; // -.85π → -.15π (top→bottom on left)\n    const r = 5.0 + (i % 2 === 0 ? 0.6 : 0);\n    const c = new THREE.Group();\n    c.position.set(boxAnchor.x + Math.cos(angle) * r, Math.sin(angle) * 3.6, -0.3 + (i % 3) * 0.4);\n    const body = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.16, 0.12), camHousingMat); c.add(body);\n    const led = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff4d2e })); led.position.z = 0.08; c.add(led);\n    c.lookAt(boxAnchor);\n    camDots.push({ group: c, led, phase: Math.random() * Math.PI * 2 });\n    camScene.add(c);\n  }\n  // Above-the-box (2)\n  for (let i = 0; i < 2; i++) {\n    const c = new THREE.Group();\n    c.position.set(boxAnchor.x - 1.4 + i * 2.8, 3.6, -0.5);\n    const body = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.16, 0.12), camHousingMat); c.add(body);\n    const led = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff4d2e })); led.position.z = 0.08; c.add(led);\n    c.lookAt(boxAnchor);\n    camDots.push({ group: c, led, phase: Math.random() * Math.PI * 2 });\n    camScene.add(c);\n  }\n  // Below-the-box (2)\n  for (let i = 0; i < 2; i++) {\n    const c = new THREE.Group();\n    c.position.set(boxAnchor.x - 1.4 + i * 2.8, -3.4, -0.5);\n    const body = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.16, 0.12), camHousingMat); c.add(body);\n    const led = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff4d2e })); led.position.z = 0.08; c.add(led);\n    c.lookAt(boxAnchor);\n    camDots.push({ group: c, led, phase: Math.random() * Math.PI * 2 });\n    camScene.add(c);\n  }\n\n  // Faint capture beams from each camera toward the box\n  const beams = [];\n  camDots.forEach((cd, i) => {\n    if (i % 2 !== 0) return;\n    const g = new THREE.BufferGeometry().setFromPoints([cd.group.position, boxAnchor]);\n    const ln = new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xff4d2e, transparent: true, opacity: 0.06 }));\n    beams.push(ln); camScene.add(ln);\n  });\n\n  // Atmospheric dust (kept faint, fullscreen)\n  const dustGeo = new THREE.BufferGeometry();\n  const dN = 500;\n  const dp = new Float32Array(dN * 3);\n  const dc = new Float32Array(dN * 3);\n  const palette = [new THREE.Color(0xff4d2e), new THREE.Color(0x00e5ff), new THREE.Color(0xb266ff), new THREE.Color(0xffe6c8)];\n  for (let i = 0; i < dN; i++) {\n    dp[i*3]   = (Math.random() - 0.5) * 22;\n    dp[i*3+1] = (Math.random() - 0.5) * 12;\n    dp[i*3+2] = (Math.random() - 0.5) * 14;\n    const c = palette[Math.floor(Math.random() * palette.length)];\n    dc[i*3] = c.r; dc[i*3+1] = c.g; dc[i*3+2] = c.b;\n  }\n  dustGeo.setAttribute('position', new THREE.BufferAttribute(dp, 3));\n  dustGeo.setAttribute('color', new THREE.BufferAttribute(dc, 3));\n  const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({\n    size: 0.025, vertexColors: true, transparent: true, opacity: 0.45,\n    blending: THREE.AdditiveBlending, depthWrite: false\n  }));\n  camScene.add(dust);\n\n  // ============= INPUT =============\n  // Mouse position relative to the performer box\n  const mouseInBox = { x: 0, y: 0, active: false };\n  const mouseGlobal = { x: 0, y: 0 };\n  window.addEventListener('mousemove', (e) => {\n    mouseGlobal.x = (e.clientX / window.innerWidth) * 2 - 1;\n    mouseGlobal.y = -(e.clientY / window.innerHeight) * 2 + 1;\n    const hud = document.querySelector('.mocap-hero-hud');\n    if (hud) {\n      const r = hud.getBoundingClientRect();\n      mouseInBox.x = ((e.clientX - r.left) / r.width) * 2 - 1;\n      mouseInBox.y = -((e.clientY - r.top) / r.height) * 2 + 1;\n      mouseInBox.active = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;\n    }\n  });\n\n  // Sizers\n  function sizeAll() {\n    // Performer canvas matches HUD box\n    const hud = document.querySelector('.mocap-hero-hud');\n    if (hud && hud.offsetParent !== null) {\n      const r = hud.getBoundingClientRect();\n      perfRenderer.setSize(r.width, r.height, false);\n      perfCam.aspect = r.width / r.height; perfCam.updateProjectionMatrix();\n    }\n    // Camera (fullscreen)\n    camRenderer.setSize(window.innerWidth, window.innerHeight, false);\n    camCam.aspect = window.innerWidth / window.innerHeight; camCam.updateProjectionMatrix();\n  }\n  sizeAll();\n  window.addEventListener('resize', sizeAll);\n\n  // Cursor target in performer-space — uses mouse-in-box if hovering, else global mouse\n  const targetWorld = new THREE.Vector3(0, 0.4, 0.4);\n  const targetCur = new THREE.Vector3(0, 0.4, 0.4);\n\n  const tcEl = document.getElementById('hero-tc');\n  const tcStart = performance.now();\n\n  let t = 0;\n  function animate() {\n    t += 0.014;\n\n    // Cursor target\n    const useBox = mouseInBox.active;\n    const mx = useBox ? mouseInBox.x : mouseGlobal.x;\n    const my = useBox ? mouseInBox.y : mouseGlobal.y;\n    const tx = mx * 2.2;\n    const ty = 0.4 + my * 1.6;\n    const tz = 0.3 + Math.abs(mx) * 0.5;\n    targetWorld.set(tx, ty, tz);\n    targetCur.lerp(targetWorld, 0.10);\n    targetGroup.position.copy(targetCur);\n    targetGroup.lookAt(perfCam.position);\n    targetRing.rotation.z += 0.04;\n    targetRing2.rotation.z -= 0.025;\n    targetCore.scale.setScalar(1 + Math.sin(t * 4) * 0.25);\n\n    // Cursor in performer-local space\n    const lt = targetCur.clone().sub(perf.position).divideScalar(perf.scale.x);\n\n    // Idle baseline\n    const swayX = Math.sin(t * 0.6) * 0.05;\n    const breath = Math.sin(t * 1.8) * 0.02;\n    Object.entries(rig).forEach(([key, base]) => {\n      markers[key].userData.cur = [base[0] + swayX, base[1] + breath, base[2]];\n    });\n\n ogo image and draw it centered on transparency.\n    const img = new Image();\n    img.crossOrigin = 'anonymous';\n    img.onload = () => {\n      const pad = 40;\n      const maxW = c.width - pad * 2;\n      const maxH = c.height - pad * 2;\n      const ratio = Math.min(maxW / img.width, maxH / img.height);\n      const w = img.width * ratio, h = img.height * ratio;\n      const x = (c.width - w) / 2;\n      const y = (c.height - h) / 2;\n      ctx.clearRect(0, 0, c.width, c.height);\n      ctx.drawImage(img, x, y, w, h);\n      tex.needsUpdate = true;\n    };\n    img.onerror = () => {\n      ctx.fillStyle = 'rgba(255,255,255,0.85)';\n      ctx.font = '700 42px \"Syncopate\", sans-serif';\n      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n      ctx.fillText(b.name.toUpperCase(), c.width / 2, c.height / 2);\n      tex.needsUpdate = true;\n    };\n    img.src = (window.__resources && window.__resources[b.src]) || b.src;\n\n    return tex;\n  }\n  const orbs = [];\n  const root = new THREE.Group(); scene.add(root);\n  brands.forEach((b, i) => {\n    const ph = Math.acos(2 * (i + 0.5) / brands.length - 1);\n    const th = Math.PI * (1 + Math.sqrt(5)) * i;\n    const r = 4.4;\n    const g = new THREE.Group();\n    g.position.set(r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph), r * Math.sin(ph) * Math.sin(th));\n    const plane = new THREE.Mesh(\n      new THREE.PlaneGeometry(1.9, 1.07),\n      new THREE.MeshBasicMaterial({\n        map: makeLogoTexture(b), transparent: true,\n        side: THREE.DoubleSide, depthWrite: false\n      })\n    );\n    g.add(plane);\n    g.userData = { phase: Math.random() * Math.PI * 2, label: b.name };\n    orbs.push(g); root.add(g);\n  });\n  // === Atheorem logo in the center of the orbit (logo only, transparent) ===\n  function makeAtheoremTexture() {\n    const c = document.createElement('canvas');\n    c.width = 768; c.height = 432;\n    const ctx = c.getContext('2d');\n    const tex = new THREE.CanvasTexture(c);\n    tex.anisotropy = 4;\n    // draw only the Atheorem logo, centered on transparency\n    const img = new Image();\n    img.crossOrigin = 'anonymous';\n    img.onload = () => {\n      const pad = 30;\n      const maxW = c.width - pad * 2;\n      const maxH = c.height - pad * 2;\n      const ratio = Math.min(maxW / img.width, maxH / img.height);\n      const w = img.width * ratio, h = img.height * ratio;\n      ctx.clearRect(0, 0, c.width, c.height);\n      ctx.drawImage(img, (c.width - w) / 2, (c.height - h) / 2, w, h);\n      tex.needsUpdate = true;\n    };\n    img.src = (window.__resources && window.__resources.logo) || 'logo.png';\n    return tex;\n  }\n\n  const center = new THREE.Group(); root.add(center);\n  const centerPlane = new THREE.Mesh(\n    new THREE.PlaneGeometry(2.4, 1.35),\n    new THREE.MeshBasicMaterial({\n      map: makeAtheoremTexture(), transparent: true,\n      side: THREE.DoubleSide, depthWrite: false\n    })\n  );\n  center.add(centerPlane);\n\n  // === Drag-rotate, wheel-zoom, auto-orbit ===\n  const ctrl = { yaw: 0, pitch: 0, dist: 9, targetYaw: 0, targetPitch: 0, targetDist: 9, auto: true };\n  let dragging = false, lastX = 0, lastY = 0, lastInteract = 0;\n  const host = canvas.parentElement;\n  host.addEventListener('pointerdown', (e) => {\n    dragging = true; lastX = e.clientX; lastY = e.clientY;\n    ctrl.auto = false; lastInteract = performance.now();\n    host.setPointerCapture && host.setPointerCapture(e.pointerId);\n  });\n  host.addEventListener('pointermove', (e) => {\n    if (!dragging) return;\n    const dx = e.clientX - lastX, dy = e.clientY - lastY;\n    lastX = e.clientX; lastY = e.clientY;\n    ctrl.targetYaw   -= dx * 0.008;\n    ctrl.targetPitch += dy * 0.006;\n    ctrl.targetPitch = Math.max(-0.9, Math.min(0.9, ctrl.targetPitch));\n  });\n  host.addEventListener('pointerup', () => { dragging = false; lastInteract = performance.now(); });\n  host.addEventListener('pointercancel', () => { dragging = false; });\n  host.addEventListener('wheel', (e) => {\n    e.preventDefault();\n    ctrl.targetDist += e.deltaY * 0.008;\n    ctrl.targetDist = Math.max(5, Math.min(14, ctrl.targetDist));\n    lastInteract = performance.now();\n  }, { passive: false });\n\n  let t = 0;\n  function loop() {\n    t += 0.01;\n    // Resume auto-orbit after 3.5s of no interaction\n    // Resume auto-orbit after 3.5s of no interaction\n    if (!ctrl.auto && performance.now() - lastInteract > 3500 && !dragging) ctrl.auto = true;\n    if (ctrl.auto) ctrl.targetYaw += 0.0035;\n    ctrl.yaw   += (ctrl.targetYaw   - ctrl.yaw)   * 0.10;\n    ctrl.pitch += (ctrl.targetPitch - ctrl.pitch) * 0.10;\n    ctrl.dist  += (ctrl.targetDist  - ctrl.dist)  * 0.08;\n    root.rotation.y = ctrl.yaw;\n    root.rotation.x = ctrl.pitch;\n    camera.position.z = ctrl.dist;\n    center.lookAt(camera.position);\n    orbs.forEach(o => {\n      o.lookAt(camera.position);\n      o.scale.setScalar(1 + Math.sin(t + o.userData.phase) * 0.03);\n    });\n    renderer.render(scene, camera);\n    requestAnimationFrame(loop);\n  }\n  setTimeout(() => { resize(); loop(); }, 50);\n  window.addEventListener('resize', resize);\n})();\n\n(function contactScene() {\n  const canvas = document.getElementById('contact-canvas');\n  if (!canvas || window.__SKIP_DECOR_GL) return;\n  const scene = new THREE.Scene();\n  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / 600, 0.1, 100);\n  camera.position.z = 8;\n  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });\n  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\n  const resize = () => {\n    const r = canvas.parentElement.getBoundingClientRect();\n    renderer.setSize(r.width, r.height, false);\n    camera.aspect = r.width / r.height; camera.updateProjectionMatrix();\n  };\n  const cnt = 900;\n  const geo = new THREE.BufferGeometry();\n  const pos = new Float32Array(cnt * 3);\n  for (let i = 0; i < cnt; i++) {\n    pos[i*3] = (Math.random() - 0.5)
